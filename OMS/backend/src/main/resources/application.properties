spring.application.name=OMS-backend
server.port=8080
# 프록시(Vite dev server, nginx) 뒤에서 X-Forwarded-Host/Proto/For를 반영 → 서브도메인(테넌트) 판별과 클라이언트 IP에 사용
server.forward-headers-strategy=framework

# 서브도메인 테넌트 (AS-IS: {sys01_loc_nm}.도메인 으로 접속)
#  - kfstest.localhost:8082/OMS → sys01_company.sys01_loc_nm='kfstest'
#  - admin-aliases: KFS 관리자 서브도메인. 로그인 화면에서 회사를 선택할 수 있다
#  - default-code: 서브도메인이 없는 호스트(localhost, IP)로 접속했을 때의 회사 코드
asseterp.tenant.admin-code=admin
asseterp.tenant.admin-aliases=admin,admindev,admindr,extadmin
asseterp.tenant.default-code=admin

# Database (PostgreSQL)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432,postgres:5432/asseterpdb
spring.datasource.username=kdy987
spring.datasource.password=kalpa987!

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=kalpa987!-wearetheworldzaq1@WSX

# Redis 접속 호스트 자동 탐색: spring.data.redis.host 접속 실패 시 순서대로 시도 (도커 별칭, 브릿지 게이트웨이)
asseterp.redis.fallback-hosts=redis,172.18.0.1
asseterp.redis.connect-timeout=400ms

# JWT Configuration (수명 단위: ms) - access 30분, refresh(세션) 8시간
jwt.secret=asseterp-oms-super-secret-jwt-key-for-hmac-sha-256-algorithm-compliance
jwt.issuer=asset-erp
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=28800000

# 인증 쿠키 (Max-Age는 jwt.refresh-token-expiration을 따름)
# 운영(HTTPS) 환경에서는 secure=true로 설정
jwt.cookie.secure=false
jwt.cookie.same-site=Lax
jwt.cookie.access-token-name=ACCESS_TOKEN
jwt.cookie.refresh-token-name=REFRESH_TOKEN
# REFRESH_TOKEN 쿠키 전송 경로 (컨텍스트 경로 이하, AuthController 매핑과 일치해야 함)
jwt.cookie.refresh-path=/api/auth
# 쿠키 수명 여유시간: 쿠키 Max-Age = refresh-token-expiration + 이 값
#  토큰 만료 후에도 쿠키가 잠시 남아, 서버가 만료된 세션의 사용자를 판정해 감사 로그(REFRESH_REJECTED)에 기록한다
#  (만료된 토큰은 서버가 거부하므로 보안상 영향 없음)
jwt.cookie.max-age-margin=10m

# 인증/세션
asseterp.auth.session-key-prefix=oms:user:jti:
# 발령 조직을 아직 조회하지 않아 임시로 사용하는 부서 ID
asseterp.auth.default-dept-id=D101
asseterp.auth.default-role=ROLE_USER
# Refresh Token 교체(rotation) 및 재사용 탐지
#  - 갱신할 때마다 새 Refresh Token ID(rid)를 발급하고, 이미 교체된 토큰이 다시 오면 탈취로 보고 세션을 폐기
#  - grace-period: 교체 직후 직전 토큰도 허용하는 시간 (같은 브라우저의 여러 탭이 동시에 갱신하는 경우)
asseterp.auth.refresh-rotation.key-prefix=oms:user:rid:
asseterp.auth.refresh-rotation.previous-key-prefix=oms:user:rid-prev:
asseterp.auth.refresh-rotation.grace-period=5s
# 로그인 실패 잠금 (사원만): max-failures회 연속 실패 시 emp01_person.emp01_lock_yn='true' (관리자 해제 전까지 유지)
#  - AS-IS와 같은 5회. AS-IS는 브라우저 변수로 셌지만 여기서는 Redis에 센다
#  - fail-count-ttl: 마지막 실패 후 이 시간이 지나면 실패 횟수 초기화
asseterp.auth.login-lock.max-failures=5
asseterp.auth.login-lock.fail-count-key-prefix=oms:login:fail:
asseterp.auth.login-lock.fail-count-ttl=24h
# 비밀번호 만료 경과일 (AS-IS 90일, sys25_password.sys25_work_date 기준). 만료되면 로그인 거부
asseterp.auth.password-expire-days=90
# 인증 없이 접근 가능한 경로: WAR 정적 리소스 / public 폴더 / 인증 공개 API
asseterp.auth.permit-all-paths=/,/index.html,/assets/**,/static/**,/favicon.ico,/*.js,/*.css,/*.png,/*.svg,/public/**,/error,\
  /api/auth/login,/api/auth/refresh,/api/auth/logout,/api/public/**

# CORS: 프론트엔드 개발 서버(5173), 내장 톰캣(8080), 운영 톰캣(8082) - 서브도메인(*.localhost) 포함 (origin pattern)
asseterp.cors.allowed-origins=http://localhost:5173,http://localhost:8080,http://localhost:8082,\
  http://*.localhost:5173,http://*.localhost:8080,http://*.localhost:8082
asseterp.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
asseterp.cors.allowed-headers=*
asseterp.cors.max-age=1h

# WebSocket (STOMP, docs/websocket-설계.md)
#  - endpoint: 컨텍스트 경로 이하 STOMP 엔드포인트. handshake는 ACCESS_TOKEN 쿠키로 인증 (permit-all에 넣지 않음)
#  - instance-id: 서버 인스턴스 식별자 (비우면 기동 시 무작위 8자리), presence 항목과 로그에 표시
#  - redis-channel: 서버발 메시지를 모든 인스턴스로 전달하는 Redis Pub/Sub 채널
#  - presence-key: 접속자 현황 HASH (field={instanceId}:{sessionId})
#  - instance-key-prefix / instance-ttl: 인스턴스 생존 키. 갱신이 끊긴 인스턴스의 presence 항목은 조회 시 제외·삭제
#  - sweep-interval: 연결된 세션의 jti를 Redis와 대조하는 주기 (세션 만료·누락된 종료 이벤트 보정)
#  - heartbeat: STOMP heartbeat (서버→클라이언트, 클라이언트→서버 동일)
#  - close-delay: 세션 종료 메시지를 보낸 뒤 소켓을 닫기까지 대기 시간 (메시지 전달 보장)
asseterp.ws.endpoint=/ws
asseterp.ws.instance-id=
asseterp.ws.redis-channel=asseterp:ws:events
asseterp.ws.presence-key=oms:ws:presence
asseterp.ws.instance-key-prefix=oms:ws:instance:
asseterp.ws.instance-ttl=30s
asseterp.ws.sweep-interval=10s
asseterp.ws.heartbeat=10s
asseterp.ws.close-delay=1s

# Multipart File Upload (Max 500MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# AssetERP Base Directory
asseterp.base.dir=/home/kdy987/tmp/asseterp-data
asseterp.upload.dir=${asseterp.base.dir}/uploads

# 업로드 허용 확장자(소문자) -> Apache Tika 매직 넘버로 판별된 허용 MIME 타입
# tika-core 기준 OOXML(docx/xlsx/pptx)은 zip 계열, OLE2(doc/xls/ppt/hwp)는 x-tika-msoffice로 판별된다.
asseterp.upload.allowed-types.jpg=image/jpeg
asseterp.upload.allowed-types.jpeg=image/jpeg
asseterp.upload.allowed-types.png=image/png
asseterp.upload.allowed-types.gif=image/gif
asseterp.upload.allowed-types.pdf=application/pdf
asseterp.upload.allowed-types.txt=text/plain,text/csv
asseterp.upload.allowed-types.csv=text/plain,text/csv
asseterp.upload.allowed-types.xlsx=application/x-tika-ooxml,application/zip
asseterp.upload.allowed-types.docx=application/x-tika-ooxml,application/zip
asseterp.upload.allowed-types.pptx=application/x-tika-ooxml,application/zip
asseterp.upload.allowed-types.xls=application/x-tika-msoffice,application/vnd.ms-excel
asseterp.upload.allowed-types.doc=application/x-tika-msoffice,application/msword
asseterp.upload.allowed-types.ppt=application/x-tika-msoffice,application/vnd.ms-powerpoint
asseterp.upload.allowed-types.hwp=application/x-tika-msoffice,application/x-hwp
asseterp.upload.allowed-types.hwpx=application/zip
asseterp.upload.allowed-types.zip=application/zip

# Logging (logback-spring.xml, docs/log-설계.md)
#  - {app-name}-info.log / -error.log / -audit.log 로 분리, 지난 로그는 archived/yyyy-MM/ 아래 gzip 보관
#  - max-history: 보관 일수, total-size-cap: 해당 종류 아카이브 전체 용량 상한 (초과 시 오래된 것부터 삭제)
#  - prod 프로필(spring.profiles.active=prod)에서는 콘솔 출력을 끈다
logging.file.path=${asseterp.base.dir}/logs
asseterp.log.app-name=${spring.application.name}
asseterp.log.info.max-history=30
asseterp.log.info.max-file-size=100MB
asseterp.log.info.total-size-cap=20GB
asseterp.log.error.max-history=90
asseterp.log.error.max-file-size=100MB
asseterp.log.error.total-size-cap=10GB
# 감사 로그: 접근기록 보관 의무 대응 (3년)
asseterp.log.audit.max-history=1095
asseterp.log.audit.max-file-size=100MB
asseterp.log.audit.total-size-cap=50GB
asseterp.log.async.queue-size=1024
asseterp.log.async.max-flush-time=5000
# 세션 만료 감사: Redis 세션 키(asseterp.auth.session-key-prefix)의 TTL 만료 이벤트를 받아 SESSION_EXPIRED 기록
#  - Redis에 notify-keyspace-events Ex 설정 필요 (없으면 이벤트가 오지 않을 뿐 오류는 없음)
#  - dedup: 서버 여러 대가 같은 이벤트를 받으므로 SET NX로 한 대만 기록
asseterp.audit.session-expiry.enabled=true
asseterp.audit.session-expiry.dedup-key-prefix=oms:audit:session-expired:
asseterp.audit.session-expiry.dedup-ttl=10s
# 요청 추적 ID 응답 헤더 (프론트 에러 메시지에 표시, 로그 검색 키)
asseterp.log.trace-header=X-Trace-Id
# 요청 종료 로그 (method uri status elapsedMs), exclude-paths는 기록 제외 경로
asseterp.log.request-log.enabled=true
asseterp.log.request-log.exclude-paths=/,/index.html,/assets/**,/favicon.ico,/*.js,/*.css,/*.png,/*.svg
logging.level.root=INFO
logging.level.kr.co.kfs.asseterp.oms=DEBUG
logging.level.org.springframework.security=INFO
logging.level.kr.co.kfs.asseterp.oms.access=INFO

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
# record DTO를 컬럼 순서가 아니라 컬럼 이름(snake → camel)으로 생성자에 매핑한다 (-parameters 컴파일 필요, Spring Boot 기본)
mybatis.configuration.arg-name-based-constructor-auto-mapping=true
