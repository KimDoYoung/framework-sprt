<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>AgGrid - 고정컬럼 · 합계 · 2단헤더</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-quartz.css">
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>

<style>
  body {
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: #f4f6fa;
    margin: 0;
    padding: 24px;
    color: #1f2937;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; font-size: 13px; color: #6b7280; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .btn {
    padding: 8px 14px; border-radius: 8px; border: 1px solid transparent;
    font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s;
  }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-primary:hover { background: #4338ca; }
  .btn-outline { background: #fff; border-color: #d1d5db; color: #374151; }
  .btn-outline:hover { background: #f3f4f6; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-danger:hover { background: #dc2626; }
  .search-box {
    padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 13px; width: 240px; outline: none;
  }
  .search-box:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.1); }

  .card {
    background: #fff; border-radius: 12px; padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  #myGrid { height: 560px; width: 100%; }

  /* 합계 행 강조 */
  .ag-theme-quartz .ag-row-pinned {
    background: #eef2ff !important;
    font-weight: 700;
    border-top: 2px solid #4f46e5;
  }
  .ag-theme-quartz .ag-row-pinned .ag-cell {
    color: #312e81;
  }

  /* 그룹 헤더 색상 */
  .ag-theme-quartz .ag-header-group-cell {
    background: #f8fafc;
    font-weight: 700;
    color: #4338ca;
  }
</style>
</head>
<body>

<h1>📊 AgGrid 샘플</h1>
<p class="sub">① 왼쪽 2컬럼 고정 &nbsp;|&nbsp; ② 하단 합계행 &nbsp;|&nbsp; ③ 2단 컬럼 헤더 (2026년 → 1~4분기)</p>

<div class="toolbar">
  <button class="btn btn-primary" onclick="addRow()">+ 행 추가</button>
  <button class="btn btn-outline" onclick="resetData()">↩ 초기화</button>
  <button class="btn btn-danger" onclick="deleteSelected()">🗑 선택 삭제</button>
  <input class="search-box" id="searchInput" placeholder="🔍 이름/부서 검색 (외부 필터)" />
</div>

<div class="card">
  <div id="myGrid" class="ag-theme-quartz"></div>
</div>

<script>
/* =========================================================
   데이터 생성
========================================================= */
const NAMES = ['김민준','이서연','박도윤','최지우','정하준','강서윤','조은우','윤채원','장시우','임하린'];
const DEPTS = ['개발팀','디자인팀','마케팅팀','영업팀','인사팀','재무팀'];

function rand(n){ return Math.floor(Math.random() * n); }
function pick(a){ return a[rand(a.length)]; }

function makeRow(i){
  return {
    id: 1000 + i,
    name: pick(NAMES),
    dept: pick(DEPTS),
    q1: 100 + rand(900),
    q2: 100 + rand(900),
    q3: 100 + rand(900),
    q4: 100 + rand(900)
  };
}

let rowData = Array.from({ length: 12 }, (_, i) => makeRow(i));

/* =========================================================
   컬럼 정의  (고정 + 그룹 + 합계 컬럼)
========================================================= */
const columnDefs = [
  /* ---------- ① 왼쪽 고정 컬럼 2개 ---------- */
  {
    field: 'id',
    headerName: 'ID',
    width: 100,
    pinned: 'left',            // ← 왼쪽 고정
    checkboxSelection: true,
    headerCheckboxSelection: true,
    editable: false,
    sortable: true
  },
  {
    field: 'name',
    headerName: '이름',
    width: 120,
    pinned: 'left',            // ← 왼쪽 고정
    editable: true
  },

  /* ---------- 일반 컬럼 ---------- */
  {
    field: 'dept',
    headerName: '부서',
    width: 130,
    editable: true,
    cellEditor: 'agSelectCellEditor',
    cellEditorParams: { values: DEPTS }
  },

  /* ---------- ③ 2단 헤더: 2026년 아래 1~4분기 ---------- */
  {
    headerName: '2026년',        // 상위 그룹 헤더
    headerGroupComponentParams: { /* 필요 시 커스텀 */ },
    children: [
      { field: 'q1', headerName: '1분기', width: 110, type: 'numericColumn', editable: true },
      { field: 'q2', headerName: '2분기', width: 110, type: 'numericColumn', editable: true },
      { field: 'q3', headerName: '3분기', width: 110, type: 'numericColumn', editable: true },
      { field: 'q4', headerName: '4분기', width: 110, type: 'numericColumn', editable: true }
    ]
  },

  /* ---------- 연간 합계 컬럼 (자동 계산) ---------- */
  {
    headerName: '연간 합계',
    width: 130,
    pinned: 'right',           // ← 오른쪽 고정 (보너스)
    editable: false,
    type: 'numericColumn',
    valueGetter: p =>
      (p.data?.q1 || 0) + (p.data?.q2 || 0) + (p.data?.q3 || 0) + (p.data?.q4 || 0),
    cellStyle: { fontWeight: '700', color: '#4f46e5' }
  }
];

/* =========================================================
   ② 합계행 계산 함수
   - rowData 를 기반으로 q1~q4, 연간합계 총합 생성
========================================================= */
function calcBottomRow(){
  const sum = { id: '합계', name: '합계', dept: '' };
  ['q1','q2','q3','q4'].forEach(f => {
    sum[f] = rowData.reduce((acc, r) => acc + (r[f] || 0), 0);
  });
  sum.total = sum.q1 + sum.q2 + sum.q3 + sum.q4;
  return sum;
}

/* =========================================================
   Grid 옵션
========================================================= */
const gridOptions = {
  columnDefs,
  rowData,

  /* ① 고정 컬럼이 잘 보이도록 */
  pinnedLeftWidth: 220,

  /* ② 하단 합계행 */
  pinnedBottomRowData: [ calcBottomRow() ],

  /* 선택 */
  rowSelection: { mode: 'multiRow' },
  animateRows: true,

  /* 페이징 */
  pagination: true,
  paginationPageSize: 10,
  paginationPageSizeSelector: [10, 20, 50],

  defaultColDef: {
    resizable: true,
    sortable: true
  },

  suppressMenu: true,  // AgGrid 자체 필터 미사용

  /* ---------- 외부 검색 필터 ---------- */
  isExternalFilterPresent: () =>
    document.getElementById('searchInput').value.trim().length > 0,

  doesExternalFilterPass: node => {
    const v = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!v) return true;
    return ['name', 'dept'].some(f =>
      String(node.data?.[f] ?? '').toLowerCase().includes(v)
    );
  },

  /* ---------- 이벤트 ---------- */
  onCellValueChanged: () => {
    // 값 편집 시 합계행 갱신
    gridApi.setGridOption('pinnedBottomRowData', [ calcBottomRow() ]);
  }
};

/* =========================================================
   Grid 생성 (v31+ 방식)
========================================================= */
let gridApi;
gridApi = agGrid.createGrid(document.getElementById('myGrid'), gridOptions);

/* 외부 검색 이벤트 */
document.getElementById('searchInput').addEventListener('input', () => {
  gridApi.onFilterChanged();
});

/* =========================================================
   툴바 액션
========================================================= */
function addRow(){
  const newRow = makeRow(rowData.length);
  rowData = [newRow, ...rowData];
  refresh();
}

function resetData(){
  rowData = Array.from({ length: 12 }, (_, i) => makeRow(i));
  refresh();
}

function deleteSelected(){
  const sel = gridApi.getSelectedRows();
  if (!sel.length) return alert('삭제할 행을 선택하세요.');
  if (!confirm(`${sel.length}건을 삭제하시겠습니까?`)) return;

  const ids = new Set(sel.map(r => r.id));
  rowData = rowData.filter(r => !ids.has(r.id));
  refresh();
}

/* 데이터 + 합계행 동시 갱신 */
function refresh(){
  gridApi.setGridOption('rowData', rowData);
  gridApi.setGridOption('pinnedBottomRowData', [ calcBottomRow() ]);
}
</script>
</body>
</html>
