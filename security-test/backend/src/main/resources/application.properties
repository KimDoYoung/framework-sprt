spring.application.name=security-test-backend
server.port=8080

# Database (PostgreSQL)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432,postgres:5432/asseterpdb
spring.datasource.username=kdy987
spring.datasource.password=kalpa987!

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=kalpa987!-wearetheworldzaq1@WSX

# JWT Configuration
jwt.secret=asseterp-security-test-super-secret-jwt-key-for-hmac-sha-256-algorithm-compliance
jwt.issuer=asset-erp
jwt.access-token-expiration=10000
jwt.refresh-token-expiration=60000
# 운영(HTTPS) 환경에서는 true로 설정
jwt.cookie-secure=false

# Multipart File Upload (Max 500MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# AssetERP Base Directory
asseterp.base.dir=/home/kdy987/tmp/asseterp-data
asseterp.upload.dir=${asseterp.base.dir}/uploads

# Logging
logging.file.path=${asseterp.base.dir}/logs
logging.file.name=${logging.file.path}/security-test.log
logging.logback.rollingpolicy.file-name-pattern=${logging.file.path}/security-test-%d{yyyy-MM-dd}.log
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.max-file-size=50MB
logging.level.root=INFO
logging.level.com.asseterp.security=DEBUG

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
