# 서버: 집(omen, 192.168.0.130) — Tomcat 컨테이너 omen-tomcat. 프로파일은 /data/docker/omen-tomcat/bin/setenv.sh 의 spring.profiles.active
# RD 시뮬레이터(tools/run-rd-server.sh)는 컨테이너 밖 호스트에서 돈다 → RD_SIM_HOST=0.0.0.0 RD_SIM_ROOT=${asseterp.base.dir} 로 켠다
asseterp.rd.url=http://192.168.0.130:5151

# 알림 시뮬레이터(tools/run-notice-server.sh, AA01) — RD 시뮬레이터와 같은 호스트. NOTICE_SIM_HOST=0.0.0.0 으로 켠다 (talk·sms 5161, 메일 SMTP 2525)
asseterp.notice.talk-url=http://192.168.0.130:5161/talk/api/sendmsg
asseterp.notice.sms-url=http://192.168.0.130:5161/index.php/api_v2/sms_change_word
asseterp.notice.mail-host=192.168.0.130

# 배치 API — 개발용 (이 PC와 로컬 docker 대역에서만 호출. 컨테이너 안의 Tomcat은 호출 IP를 docker 게이트웨이(172.18.0.1)로 본다). 키는 개발용 더미이며 운영 값이 아니다
asseterp.batch.enabled=true
asseterp.batch.api-key=${ASSETERP_BATCH_API_KEY:dev-batch-key}
asseterp.batch.allowed-ips=127.0.0.1,::1,172.16.0.0/12

# ICAM 읽기: simulator(CSV, data/icam-simulator) / real(Tibero, 운영) / disabled(거절)
asseterp.icam.mode=simulator
asseterp.icam.simulator-dir=${ASSETERP_ICAM_SIMULATOR_DIR:../data/icam-simulator}

# A-View 문서 미리보기 (AS-IS JsonFileView_AView viewerHomePath) — file-base-url은 A-View 서버가 이 서버의 임시 파일을 가져갈 주소
#  (AS-IS Sys10_Lookup_FileViewer: 운영 https://admin.k-fs.co.kr:{port}, 개발 https://admindev.k-fs.co.kr:{port}). 비우면 PDF·그림만 미리보기
asseterp.aview.home-url=https://aview.k-fs.co.kr:7171/aview
asseterp.aview.file-base-url=${ASSETERP_AVIEW_FILE_BASE_URL:}

# 온라인 도움말 (AS-IS idms-*.properties manualBaseUrl, aman_opener.jsp AMAN_BASE_URL). A-Man 서명 키는 환경변수로만 (비우면 A-Man 연결 안 함)
asseterp.help.manual-base-url=https://jungseohyun.github.io/idms-user-manual/
asseterp.help.aman-url=https://aview.k-fs.co.kr:7171/aman
asseterp.help.aman-secret=${ASSETERP_AMAN_SECRET:}
